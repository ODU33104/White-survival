name: Player motion quality gate

on:
  push:
    branches: [main]
    paths:
      - 'player-motion.js'
      - 'player-test.js'
      - 'player-test.html'
      - 'game.js'
      - 'index.html'
      - 'player-test.css'
      - 'assets/player/**'
      - 'tests/**'
      - '.github/workflows/player-quality.yml'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check player-motion.js && node --check player-test.js && node --check game.js
      - run: node --test tests/player-motion.test.cjs
      - name: Browser rendering and controls
        run: |
          which google-chrome || which google-chrome-stable
          npm install --no-save playwright-core@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" node tests/browser-qa.cjs
      - name: Keep mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-mobile-screenshots
          path: qa/screenshots/
          if-no-files-found: ignore
